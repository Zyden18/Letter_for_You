{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6f0"><title>{% block title %}A little date question{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <main class="page">
    <span class="sparkle one" aria-hidden="true">✦</span><span class="sparkle two" aria-hidden="true">♡</span><span class="sparkle three" aria-hidden="true">✧</span>
    <article class="card"><div class="top-wash"></div><div class="content">
      {% block content %}{% endblock %}
      <footer class="footer">Made with a little courage and a lot of heart ♡</footer>
    </div></article>
  </main>
</body>
</html>
